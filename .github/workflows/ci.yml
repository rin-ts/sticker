name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake pkg-config libpng-dev libjpeg-dev libwebp-dev
      - name: Install Bun dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test
